name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly auto-build on Sunday at 2 AM
  workflow_dispatch:      # Allow manual trigger from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🛠️ 2. Set up JDK 17 (required by AGP 8.2 + compileSdk 34)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # 💾 3. Cache Gradle dependencies
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 📦 4. Set up Android SDK (ensure platform 34 + build-tools present)
      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(find /usr/local/lib/android -name sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Expected: $SDK_ROOT  sdkmanager: $SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
            yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          fi

      # 🔧 5. Make the Gradle wrapper executable
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 🏗️ 6. Assemble Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 📤 7. Upload APK as artifact (available for 90 days)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # 📦 8. (Optional) Create GitHub Release on version tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false