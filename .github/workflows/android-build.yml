name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 0'  # Weekly auto-build on Sunday at 2 AM

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 📥 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🛠️ 2. Set up JDK 21 (your project uses JDK 21, Android Plugin 8.1.0)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle

      # 💾 3. Cache Gradle dependencies
      - name: Cache Gradle modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*)' }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 📦 4. Set up Android SDK (API level 30, matching your project)
      - name: Set up Android SDK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          script: false

      # 🔧 5. Grant permissions for Android SDK build tools
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # 🏗️ 6. Assemble Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 📤 7. Upload APK as artifact (available for 90 days)
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/debug/app-debug.apk

      # 📦 8. (Optional) Create GitHub Release on version tag
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/debug/app-debug.apk
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false